<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CogniFlow AI - Redirecting...</title>
  <script>
    // Redirect to login if not authenticated, otherwise go to dashboard
    try {
      const session = localStorage.getItem('cogniflow_session');
      if (session) {
        window.location.href = 'html/dashboard.html';
      } else {
        window.location.href = 'html/login.html';
      }
    } catch (e) {
      console.error("Storage access failed, defaulting to login", e);
      window.location.href = 'html/login.html';
    }
  </script>
</head>
<body>
  <p style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; margin-top: 100px; color: #57606a;">
    Redirecting to CogniFlow AI...
  </p>
</body>
</html>
